name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    # ubuntu-24.04, not ubuntu-latest: the locked SVD scores were measured
    # with this image's NumPy 1.26.4 and reference BLAS/LAPACK 3.12.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-numpy python3-pip python3-setuptools libblas3 liblapack3
          # Keep reference libblas/liblapack. A pip NumPy wheel (2.5.4, OpenBLAS)
          # is what made run 39546214849 report 204 passed and 12 failed.
          if update-alternatives --list libblas.so.3-x86_64-linux-gnu >/dev/null 2>&1; then
            sudo update-alternatives --set libblas.so.3-x86_64-linux-gnu /usr/lib/x86_64-linux-gnu/blas/libblas.so.3
          fi
          if update-alternatives --list liblapack.so.3-x86_64-linux-gnu >/dev/null 2>&1; then
            sudo update-alternatives --set liblapack.so.3-x86_64-linux-gnu /usr/lib/x86_64-linux-gnu/lapack/liblapack.so.3
          fi
          python3 -m pip install --break-system-packages 'pytest>=7.4'
          python3 -m pip install --break-system-packages --no-deps -e .
          python3 - << 'PY'
          import math
          import os
          import numpy as np
          from neuralese.factorization import pin_blas_threads
          pin_blas_threads(1)
          np.linalg.svd(np.eye(2))
          loaded = []
          for line in open("/proc/self/maps", encoding="utf-8", errors="replace"):
              lower = line.lower()
              if any(token in lower for token in ("libblas", "liblapack", "libopenblas")):
                  path = line.split()[-1]
                  if path.startswith("/") and path not in loaded:
                      loaded.append(path)
          flags = ""
          try:
              for line in open("/proc/cpuinfo", encoding="utf-8", errors="replace"):
                  if line.startswith("flags"):
                      flags = line
                      break
          except OSError:
              flags = ""
          ratio = 39 / 5
          print("numpy", np.__version__)
          print("numpy_file", np.__file__)
          print("libraries", loaded)
          print("cpu_count", os.cpu_count())
          print("OMP_NUM_THREADS", os.environ.get("OMP_NUM_THREADS"))
          print("OPENBLAS_NUM_THREADS", os.environ.get("OPENBLAS_NUM_THREADS"))
          print("MKL_NUM_THREADS", os.environ.get("MKL_NUM_THREADS"))
          print("avx512f", "avx512f" in flags)
          print("np_log_39_over_5", float(np.log(ratio)).hex())
          print("math_log_39_over_5", math.log(ratio).hex())
          joined = " ".join(loaded)
          assert np.__version__.startswith("1.26."), np.__version__
          assert "dist-packages" in np.__file__, np.__file__
          assert "libblas" in joined and "libopenblas" not in joined, joined
          assert "liblapack" in joined, joined
          assert os.environ.get("OMP_NUM_THREADS") == "1"
          PY
      - name: Test
        run: |
          python3 - << 'PY'
          import math
          import os
          import numpy as np
          from neuralese.factorization import pin_blas_threads
          pin_blas_threads(1)
          np.linalg.svd(np.eye(2))
          loaded = []
          for line in open("/proc/self/maps", encoding="utf-8", errors="replace"):
              lower = line.lower()
              if any(token in lower for token in ("libblas", "liblapack", "libopenblas")):
                  path = line.split()[-1]
                  if path.startswith("/") and path not in loaded:
                      loaded.append(path)
          flags = ""
          for line in open("/proc/cpuinfo", encoding="utf-8", errors="replace"):
              if line.startswith("flags"):
                  flags = line
                  break
          ratio = 39 / 5
          print("test_process_numpy", np.__version__)
          print("test_process_numpy_file", np.__file__)
          print("test_process_libraries", loaded)
          print("test_process_cpu_count", os.cpu_count())
          print("test_process_OMP_NUM_THREADS", os.environ.get("OMP_NUM_THREADS"))
          print("test_process_OPENBLAS_NUM_THREADS", os.environ.get("OPENBLAS_NUM_THREADS"))
          print("test_process_MKL_NUM_THREADS", os.environ.get("MKL_NUM_THREADS"))
          print("test_process_avx512f", "avx512f" in flags)
          print("test_process_np_log_39_over_5", float(np.log(ratio)).hex())
          print("test_process_math_log_39_over_5", math.log(ratio).hex())
          PY
          python3 -m pytest -q
      - name: Public pack
        run: |
          python3 -m neuralese adapt examples/public_domain/hidden_states.jsonl -o /tmp/public-obs.jsonl --layout vectors
          python3 -m neuralese learn /tmp/public-obs.jsonl -o /tmp/public-pack.json --n-symbols 3 --seed 0
          python3 -m neuralese certify /tmp/public-pack.json --fail-on-undecodable
          python3 -m neuralese unfold /tmp/public-pack.json --code 0
          python3 -m neuralese learn examples/mdl_delta/observations.jsonl -o /tmp/mdl-parent.json --n-symbols 4 --min-cluster-size 1 --seed 0
          python3 -m neuralese learn examples/mdl_delta/observations.jsonl -o /tmp/mdl-child.json --parent /tmp/mdl-parent.json --n-symbols 2 --seed 0
          python3 - << 'PY'
          import json
          from pathlib import Path
          child = json.loads(Path("/tmp/mdl-child.json").read_text())
          parent = json.loads(Path("/tmp/mdl-parent.json").read_text())
          finalize = next(r for r in child["receipts"] if r["step"] == "finalize")
          delta = child["mdl_bits"] - parent["mdl_bits"]
          assert abs(finalize["delta_mdl_bits"] - delta) < 1e-6
          assert delta > 0
          assert child["metadata"]["decision"] == "reject"
          retired = [s for s in child["symbols"] if s["quarantined"]]
          assert retired
          live_codes = {s["code"] for s in child["symbols"] if not s["quarantined"]}
          assert live_codes <= {s["code"] for s in parent["symbols"]}
          PY
      - name: Prose pack
        run: |
          python3 -m neuralese learn examples/prose_corpus/observations.jsonl -o /tmp/prose-pack.json --n-symbols 8 --seed 0
          python3 -m neuralese report /tmp/prose-pack.json > /tmp/prose-report.json
          python3 -m neuralese certify /tmp/prose-pack.json --fail-on-undecodable
          python3 - << 'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("/tmp/prose-report.json").read_text())
          assert report["n_live"] == 8
          assert report["n_quarantined"] == 0
          assert report["reservoir_size"] == 320
          assert report["unfold_failures"] == []
          assert report["gloss_coverage"] == 1.0
          assert report["decision"] == "accept"
          assert 0.40 < report["residual"] < 0.55
          assert report["mdl_bits"] > 0
          PY
      - name: Varied prose
        run: |
          python3 -m neuralese learn examples/varied_prose/observations.jsonl -o /tmp/varied-pack.json --encoder word_sentence_svd --n-symbols 8 --seed 0
          python3 -m neuralese report /tmp/varied-pack.json > /tmp/varied-report.json
          python3 -m neuralese report /tmp/varied-pack.json --topics examples/varied_prose/observations.jsonl > /tmp/varied-purity.json
          python3 -m neuralese certify /tmp/varied-pack.json --fail-on-undecodable
          python3 - << 'PY'
          import json
          from collections import Counter
          from pathlib import Path
          from neuralese import load_pack
          report = json.loads(Path("/tmp/varied-report.json").read_text())
          assert report["n_live"] == 7
          assert report["n_quarantined"] == 1
          assert report["reservoir_size"] == 320
          assert report["unfold_failures"] == []
          assert report["gloss_coverage"] == 1.0
          assert report["decision"] == "accept"
          assert "cluster_purity" not in report
          assert 0.40 < report["residual"] <= 0.55
          assert abs(report["residual"] - 0.5239427941099951) < 1e-3
          assert report["mdl_bits"] > 0
          pack = load_pack("/tmp/varied-pack.json")
          assert pack.metadata["config"]["encoder"] == "word_sentence_svd"
          assert pack.metadata["config"]["tau_residual"] == 0.55
          assert pack.metadata["config"]["tau_kappa"] == 0.35
          assert pack.guards.kappa_avg >= 0.35
          scores = []
          hits = 0
          live_rows = 0
          for symbol in pack.symbols:
              if symbol.quarantined or not symbol.observation_ids:
                  continue
              counts = Counter(obs_id.rsplit("-", 1)[0] for obs_id in symbol.observation_ids)
              count = counts.most_common(1)[0][1]
              scores.append(count / len(symbol.observation_ids))
              hits += count
              live_rows += len(symbol.observation_ids)
          purity = sum(scores) / len(scores)
          # Diagnostic only. The character-trigram path on this file is about 0.31.
          # Reference BLAS 3.12 locks 7 live clusters, worst purity 29/64, and
          # size-weighted purity 204/319. The older 0.6594 figure is not a floor.
          # tau_residual 0.55 and tau_kappa 0.35 are unchanged.
          assert purity > 0.55, purity
          assert len(scores) == 7
          assert min(scores) == 29 / 64, min(scores)
          assert min(scores) < purity
          assert live_rows == 319
          assert hits == 204
          labeled = json.loads(Path("/tmp/varied-purity.json").read_text())
          diagnostic = labeled["cluster_purity"]
          assert diagnostic["worst_purity"] < 0.5
          assert abs(diagnostic["worst_purity"] - (29 / 64)) < 1e-9
          assert abs(diagnostic["size_weighted"] - (204 / 319)) < 1e-9
          assert [item["code"] for item in diagnostic["clusters"] if item["mixed"]] == [6]
          assert any(item["label"] == "mixed" for item in diagnostic["clusters"])
          PY
      - name: Activation stack
        run: |
          python3 -m neuralese adapt examples/activation_stack/hidden_states.npz -o /tmp/act-obs.jsonl --layout hf_layers --layer 0 --pool last
          python3 -m neuralese learn /tmp/act-obs.jsonl -o /tmp/act-pack.json --n-symbols 8 --seed 0
          python3 -m neuralese report /tmp/act-pack.json > /tmp/act-report.json
          python3 -m neuralese certify /tmp/act-pack.json --fail-on-undecodable
          python3 - << 'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("/tmp/act-report.json").read_text())
          assert report["n_live"] == 8
          assert report["n_quarantined"] == 0
          assert report["reservoir_size"] == 320
          assert report["unfold_failures"] == []
          assert report["gloss_coverage"] == 1.0
          assert report["decision"] == "accept"
          assert 0.40 < report["residual"] < 0.55
          assert report["mdl_bits"] > 0
          PY
