name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q
      - name: Public pack
        run: |
          python -m neuralese adapt examples/public_domain/hidden_states.jsonl -o /tmp/public-obs.jsonl --layout vectors
          python -m neuralese learn /tmp/public-obs.jsonl -o /tmp/public-pack.json --n-symbols 3 --seed 0
          python -m neuralese certify /tmp/public-pack.json --fail-on-undecodable
          python -m neuralese unfold /tmp/public-pack.json --code 0
          python -m neuralese learn examples/mdl_delta/observations.jsonl -o /tmp/mdl-parent.json --n-symbols 4 --min-cluster-size 1 --seed 0
          python -m neuralese learn examples/mdl_delta/observations.jsonl -o /tmp/mdl-child.json --parent /tmp/mdl-parent.json --n-symbols 2 --seed 0
          python - << 'PY'
          import json
          from pathlib import Path
          child = json.loads(Path("/tmp/mdl-child.json").read_text())
          parent = json.loads(Path("/tmp/mdl-parent.json").read_text())
          finalize = next(r for r in child["receipts"] if r["step"] == "finalize")
          delta = child["mdl_bits"] - parent["mdl_bits"]
          assert abs(finalize["delta_mdl_bits"] - delta) < 1e-6
          assert delta > 0
          assert child["metadata"]["decision"] == "reject"
          retired = [s for s in child["symbols"] if s["quarantined"]]
          assert retired
          live_codes = {s["code"] for s in child["symbols"] if not s["quarantined"]}
          assert live_codes <= {s["code"] for s in parent["symbols"]}
          PY
      - name: Prose pack
        run: |
          python -m neuralese learn examples/prose_corpus/observations.jsonl -o /tmp/prose-pack.json --n-symbols 8 --seed 0
          python -m neuralese report /tmp/prose-pack.json > /tmp/prose-report.json
          python -m neuralese certify /tmp/prose-pack.json --fail-on-undecodable
          python - << 'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("/tmp/prose-report.json").read_text())
          assert report["n_live"] == 8
          assert report["n_quarantined"] == 0
          assert report["reservoir_size"] == 320
          assert report["unfold_failures"] == []
          assert report["gloss_coverage"] == 1.0
          assert report["decision"] == "accept"
          assert 0.40 < report["residual"] < 0.55
          assert report["mdl_bits"] > 0
          PY
